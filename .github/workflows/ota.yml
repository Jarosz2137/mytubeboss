# Over-the-air update: every push to main builds the web bundle and publishes it as a GitHub Release
# in a PUBLIC repo (the app downloads from releases/latest without auth). No IPA, no iloader.
#
# One-time setup (see README "Aktualizacje OTA"):
#   - public repo for bundles (default Jarosz2137/mytubeboss-ota, override with repo variable OTA_REPO)
#   - secret OTA_TOKEN = fine-grained token with Contents: Read and write on that repo
#     (not needed if OTA_REPO points at this repo and this repo is public)
name: OTA update
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OTA_REPO: ${{ vars.OTA_REPO || 'Jarosz2137/mytubeboss-ota' }}
      GH_TOKEN: ${{ secrets.OTA_TOKEN || github.token }}
      HAS_TOKEN: ${{ secrets.OTA_TOKEN != '' }}
    steps:
      - name: Check OTA setup
        id: cfg
        run: |
          if [ "$HAS_TOKEN" = "true" ] || [ "$OTA_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OTA not set up yet (no OTA_TOKEN secret) - skipping. See README 'Aktualizacje OTA'."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.cfg.outputs.ok == 'true'
      - name: Build bundle
        if: steps.cfg.outputs.ok == 'true'
        run: |
          BUILD=$(date -u +%Y%m%d%H%M)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          VITE_BUILD=$BUILD VITE_OTA_REPO=$OTA_REPO npm run build
          (cd dist && zip -qr ../bundle.zip .)
          SUM=$(sha256sum bundle.zip | cut -d' ' -f1)
          printf '{"build":%s,"url":"https://github.com/%s/releases/download/b%s/bundle.zip","checksum":"%s","commit":"%s"}\n' \
            "$BUILD" "$OTA_REPO" "$BUILD" "$SUM" "$GITHUB_SHA" > version.json
          cat version.json
      - name: Publish release
        if: steps.cfg.outputs.ok == 'true'
        run: |
          gh release create "b$BUILD" bundle.zip version.json --repo "$OTA_REPO" \
            --title "MyTube Boss $BUILD" --notes "Commit $GITHUB_SHA" --latest
