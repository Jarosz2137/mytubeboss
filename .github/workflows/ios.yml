# Builds an unsigned .ipa in the cloud (no Mac needed).
# Download it from the run's "Artifacts" and install it with iloader (Importuj IPA).
# Only needed for native changes; UI/logic changes ship via ota.yml.
name: Build iOS (unsigned IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build web (stamped with build number for OTA)
        run: VITE_BUILD=$(date -u +%Y%m%d%H%M) npm run build
        env:
          VITE_OTA_REPO: ${{ vars.OTA_REPO || 'Jarosz2137/mytubeboss-ota' }}
      - run: npx cap add ios
      - run: sh scripts/patch-ios.sh
      - name: Verify background audio
        run: |
          grep -n "AVAudioSession" ios/App/App/AppDelegate.swift
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" ios/App/App/Info.plist
      - run: npx cap sync ios
      - name: Build
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr MyTubeBoss.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MyTubeBoss-ipa
          path: MyTubeBoss.ipa
