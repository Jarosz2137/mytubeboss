# Builds an installable Android APK (debug-signed, fine for sideloading / sending to friends).
name: Build Android (APK)
# Only on demand (Actions -> Build Android (APK) -> Run workflow); app updates arrive via OTA.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web
        run: VITE_BUILD=$(date -u +%Y%m%d%H%M%S) npm run build
        env:
          VITE_OTA_REPO: ${{ vars.OTA_REPO || 'Jarosz2137/mytubeboss-ota' }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - run: npx cap add android
      - run: sh scripts/patch-android.sh
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MyTubeBoss.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyTubeBoss-apk
          path: MyTubeBoss.apk
